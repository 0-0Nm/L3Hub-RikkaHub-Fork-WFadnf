name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空只出 artifact）'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew tools/build-apk.sh
          ./tools/build-apk.sh
          ls -l app/build/outputs/apk/github/debug/*.apk
          sha256sum app/build/outputs/apk/github/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L3Hub-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 幂等：release 已存在（例如手动发过、或重跑）就覆盖 APK，不要整个 job 失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖 APK"
            gh release upload "$TAG" app/build/outputs/apk/github/debug/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/github/debug/*.apk \
              --prerelease --title "$TAG" --notes "" --target "$GITHUB_SHA"
          fi
