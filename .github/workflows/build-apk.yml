name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空只出 artifact）'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布说明要用 git log 取出上一个 tag 到本 tag 的提交，浅克隆拿不到
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi

      # :terminal / :workspace 带 CMake，AGP 每次配置阶段都要 NDK 28.2.13676358（约 700MB）。
      # 上一次「Error reading Zip content from a SeekableByteChannel」就是这份下载被截断，
      # 还没走到底就红了。缓存住这个目录，之后不再依赖一次性下载。
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358-ubuntu

      # 缓存是固定 key，一次下载截断被存进去就会一直命中坏副本。
      # 每次跑之前验一下，不全就删掉让 AGP 重下（重下约 16 秒，比修一个坏缓存便宜）。
      - name: Validate NDK
        run: |
          ndk=/usr/local/lib/android/sdk/ndk/28.2.13676358
          if [ -e "$ndk" ] && { [ ! -f "$ndk/source.properties" ] || \
             [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; }; then
            echo "缓存里的 NDK 不完整，删掉重新下载"
            rm -rf "$ndk"
          fi

      - uses: pnpm/action-setup@v4
        with:
          # web-ui/pnpm-workspace.yaml 只有 allowBuilds（pnpm 10.26+ 的字段），没有 packages:，
          # pnpm 9 会报 "packages field missing or empty"，所以这里必须用 pnpm 11。
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          # 本地默认跳过 Web UI；CI 装上 pnpm 后把它一起打进包，避免 APK 里缺 static/assets
          WITH_WEB_UI: '1'
        run: |
          chmod +x gradlew tools/build-apk.sh
          ./tools/build-apk.sh
          ls -l app/build/outputs/apk/github/debug/*.apk
          sha256sum app/build/outputs/apk/github/debug/*.apk

      # Gradle 产出的名字是 app-github-arm64-v8a-debug.apk，下载下来分不清版本。
      # 这里按 tag 重命名，并附一份 sha256 供校验。
      - name: Collect APK
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # tag 事件直接用 tag 名；手动触发没填 tag 时退回 build.gradle.kts 的 versionName，
          # 否则产物会叫 L3Hub-master-arm64-v8a.apk
          tag="${INPUT_TAG:-}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            tag="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          fi
          # 首字符 - 会被 gh 当 flag；/ 和空格会让 cp 写进不存在的目录
          case "$tag" in
            ''|-*|*[!A-Za-z0-9._-]*)
              echo "非法 tag：[${tag}]" >&2
              exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "产物 tag：$tag"

          mkdir -p dist
          mapfile -t apks < <(ls app/build/outputs/apk/github/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "期望恰好 1 个 APK，实际 ${#apks[@]} 个：${apks[*]:-无}" >&2
            exit 1
          fi
          cp "${apks[0]}" "dist/L3Hub-${tag}-arm64-v8a.apk"
          ( cd dist && sha256sum "L3Hub-${tag}-arm64-v8a.apk" > "L3Hub-${tag}-arm64-v8a.apk.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: L3Hub-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 本仓库不走 PR，GitHub 的 --generate-notes 只会给一行 Full Changelog。
          # 自己按「上一个 tag..这个 tag」列提交，读的人才知道这版改了什么。
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## 本版改动"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "${prev}..${TAG}" \
                | grep -v '^- build: 版本 ' || true
              echo
              echo "**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            else
              echo "- 首个版本"
            fi
            echo
            echo "## 安装"
            echo
            echo '`L3Hub-'"${TAG}"'-arm64-v8a.apk` — arm64-v8a，包名 `com.rikkahub.l3hub.wfadnf.debug`，覆盖安装即可。'
            echo
            echo '校验：`sha256sum -c L3Hub-'"${TAG}"'-arm64-v8a.apk.sha256`'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          # 幂等：release 已存在（重跑、或手动发过）就覆盖资产并刷新说明，不要整个 job 失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产并刷新说明"
            gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --prerelease --title "$TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
