name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空只出 artifact）'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi

      # :terminal / :workspace 带 CMake，AGP 每次配置阶段都要 NDK 28.2.13676358（约 700MB）。
      # 上一次「Error reading Zip content from a SeekableByteChannel」就是这份下载被截断，
      # 还没走到底就红了。缓存住这个目录，之后不再依赖一次性下载。
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358-ubuntu

      - uses: pnpm/action-setup@v4
        with:
          # web-ui/pnpm-workspace.yaml 只有 allowBuilds（pnpm 10.26+ 的字段），没有 packages:，
          # pnpm 9 会报 "packages field missing or empty"，所以这里必须用 pnpm 11。
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          # 本地默认跳过 Web UI；CI 装上 pnpm 后把它一起打进包，避免 APK 里缺 static/assets
          WITH_WEB_UI: '1'
        run: |
          chmod +x gradlew tools/build-apk.sh
          ./tools/build-apk.sh
          ls -l app/build/outputs/apk/github/debug/*.apk
          sha256sum app/build/outputs/apk/github/debug/*.apk

      # Gradle 产出的名字是 app-github-arm64-v8a-debug.apk，下载下来分不清版本。
      # 这里按 tag 重命名，并附一份 sha256 供校验。
      - name: Collect APK
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/github/debug/*.apk | head -1)
          cp "$apk" "dist/L3Hub-${TAG}-arm64-v8a.apk"
          ( cd dist && sha256sum ./*.apk > "L3Hub-${TAG}-arm64-v8a.apk.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: L3Hub-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 幂等：release 已存在（例如手动发过、或重跑）就覆盖资产，不要整个 job 失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产"
            gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --prerelease --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
